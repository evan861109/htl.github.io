media:
  - name: images
    label: Site images
    input: assets
    output: assets
    extensions: [png, jpg, jpeg, webp]
    rename: safe
  - name: videos
    label: Site videos
    input: assets
    output: assets
    extensions: [mp4, webm, mov, m4v]
    rename: safe

settings:
  content:
    merge: true

components:
  site_content:
    type: object
    fields:
      - name: seo
        label: Search appearance
        type: object
        required: true
        fields:
          - name: title
            label: Browser title
            type: string
            required: true
          - name: description
            label: Search description
            type: text
            required: true
      - name: artist
        label: Artist
        type: object
        required: true
        fields:
          - name: name
            label: Fallback name
            type: string
            required: true
          - name: display_name
            label: Large display name
            type: string
            required: true
          - name: localized_name
            label: Localized name line
            type: string
          - name: mark
            label: Header mark
            type: string
            required: true
          - name: role
            label: Intro role
            type: string
            required: true
      - name: hero
        label: First screen
        type: object
        required: true
        fields:
          - name: image
            label: Hero image
            type: image
            required: true
            options:
              media: images
              categories: [image]
          - name: image_alt
            label: Image description
            type: text
            required: true
          - name: video_clips
            label: Background video clips (optional)
            type: file
            list:
              min: 0
              max: 3
              collapsible: false
            options:
              media: videos
              extensions: [mp4, webm, mov, m4v]
          - name: eyebrow
            label: Short introduction
            type: string
            required: true
          - name: tagline
            label: Main statement
            type: text
            required: true
          - name: primary_cta
            label: First button label
            type: string
            required: true
          - name: primary_cta_url
            label: First button destination
            type: string
            required: true
          - name: secondary_cta
            label: Second button label
            type: string
            required: true
          - name: secondary_cta_url
            label: Second button destination
            type: string
            required: true
      - name: ui
        label: Navigation and interface labels
        type: object
        fields:
          - name: nav-about
            label: About navigation label
            type: string
          - name: nav-bio
            label: Bio navigation label
            type: string
          - name: nav-listen
            label: Listen navigation label
            type: string
          - name: nav-media
            label: Media navigation label
            type: string
          - name: nav-projects
            label: Projects navigation label
            type: string
          - name: nav-materials
            label: Materials navigation label
            type: string
          - name: nav-contact
            label: Contact navigation label
            type: string
          - name: about-kicker
            label: About section label
            type: string
          - name: full-bio-link
            label: Full biography link label
            type: string
          - name: listen-kicker
            label: Listen section label
            type: string
          - name: listen-heading
            label: Listen heading
            type: string
          - name: media-library-link
            label: Media library link
            type: string
          - name: artist-biography-link
            label: Biography link
            type: string
          - name: performance-videos-link
            label: Performance videos link
            type: string
          - name: booking-materials-link
            label: Booking materials link
            type: string
          - name: contact-kicker
            label: Contact section label
            type: string
          - name: back-to-top
            label: Back to top label
            type: string
          - name: back-to-home
            label: Back to home label
            type: string
          - name: back-to-projects
            label: Back to projects label
            type: string
          - name: watch
            label: Watch button label
            type: string
      - name: practice
        label: Practice interlude
        type: object
        required: true
        fields:
          - name: kicker
            label: Section label
            type: string
            required: true
          - name: statement
            label: Main statement
            type: text
            required: true
          - name: detail
            label: Supporting detail
            type: text
            required: true
      - name: about
        label: Biography
        type: object
        required: true
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: paragraphs
            label: Biography paragraphs
            type: text
            required: true
            list:
              min: 1
              max: 6
              collapsible: false
      - name: bio
        label: Biography page
        type: object
        required: true
        fields:
          - name: seo
            label: Search appearance
            type: object
            required: true
            fields:
              - name: title
                label: Browser title
                type: string
                required: true
              - name: description
                label: Search description
                type: text
                required: true
          - name: kicker
            label: Section label
            type: string
            required: true
          - name: title
            label: Page title
            type: string
            required: true
          - name: intro
            label: Introduction
            type: text
            required: true
          - name: image
            label: Biography portrait (optional)
            description: Upload an image to fill the portrait area beside the full biography.
            type: image
            options:
              media: images
              categories: [image]
          - name: image_alt
            label: Portrait image description
            description: Describe the portrait for visitors using screen readers.
            type: text
      - name: tracks
        label: Featured videos
        type: object
        required: true
        list:
          min: 1
          max: 8
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: meta
            label: Category and format
            type: string
            required: true
          - name: title
            label: Title
            type: string
            required: true
          - name: note
            label: Description
            type: text
            required: true
          - name: url
            label: Video URL
            type: string
            required: true
      - name: projects
        label: Projects
        type: object
        required: true
        fields:
          - name: kicker
            label: Section label
            type: string
            required: true
          - name: heading
            label: Heading
            type: string
            required: true
          - name: intro
            label: Projects page introduction
            type: text
            required: true
          - name: items
            label: Entries
            type: object
            list:
              min: 1
              max: 8
              collapsible:
                collapsed: true
                summary: "{year} - {title}"
            fields:
              - name: slug
                label: Page URL slug
                type: string
                required: true
                pattern:
                  regex: "^[a-z0-9-]+$"
                  message: Use lowercase letters, numbers, and hyphens only.
              - name: year
                label: Year
                type: string
                required: true
              - name: title
                label: Title
                type: string
                required: true
              - name: description
                label: Description
                type: text
                required: true
              - name: body
                label: Project page paragraphs
                type: text
                required: true
                list:
                  min: 1
                  max: 30
                  collapsible: false
      - name: statement
        label: Artist statement
        type: object
        required: true
        fields:
          - name: text
            label: Statement
            type: text
            required: true
          - name: credit
            label: Credit line
            type: string
            required: true
      - name: contact
        label: Contact
        type: object
        required: true
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: availability
            label: Availability and location
            type: text
            required: true
          - name: email
            label: Booking email
            type: string
            pattern:
              regex: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
              message: Enter a complete email address.
          - name: notice
            label: Message shown when no email is available
            type: text
          - name: form_first_name
            label: First name field label
            type: string
            required: true
          - name: form_last_name
            label: Last name field label
            type: string
            required: true
          - name: form_email
            label: Email field label
            type: string
            required: true
          - name: form_message
            label: Message field label
            type: string
            required: true
          - name: form_submit
            label: Submit button label
            type: string
            required: true
          - name: form_note
            label: Form delivery note
            type: text
            required: true
          - name: form_subject
            label: Email subject prefix
            type: string
            required: true
          - name: links
            label: Social links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: label
                label: Label
                type: string
              - name: url
                label: URL
                type: string
  media_content:
    type: object
    fields:
      - name: seo
        label: Search appearance
        type: object
        required: true
        fields:
          - name: title
            label: Browser title
            type: string
            required: true
          - name: description
            label: Search description
            type: text
            required: true
      - name: hero
        label: Media page header
        type: object
        required: true
        fields:
          - name: image
            label: Header image
            type: image
            required: true
            options:
              media: images
              categories: [image]
          - name: image_alt
            label: Image description
            type: text
            required: true
          - name: eyebrow
            label: Short introduction
            type: string
            required: true
          - name: title
            label: Heading
            type: string
            required: true
          - name: description
            label: Introduction
            type: text
            required: true
      - name: ui
        label: Interface labels
        type: object
        fields:
          - name: featured-kicker
            label: Featured section label
            type: string
          - name: featured-heading
            label: Featured heading
            type: string
          - name: archive-kicker
            label: Archive section label
            type: string
          - name: archive-heading
            label: Archive heading
            type: string
          - name: booking-inquiry
            label: Booking inquiry label
            type: string
          - name: watch
            label: Watch button label
            type: string
      - name: featured
        label: Featured performance
        type: object
        required: true
        fields:
          - name: category
            label: Category and format
            type: string
            required: true
          - name: title
            label: Title
            type: string
            required: true
          - name: credit
            label: Composer or project credit
            type: string
            required: true
          - name: description
            label: Description
            type: text
            required: true
          - name: url
            label: Watch or listen URL
            type: string
            required: true
          - name: thumbnail
            label: Thumbnail image
            type: image
            options:
              media: images
              categories: [image]
      - name: entries
        label: Media entries
        type: object
        required: true
        list:
          min: 1
          max: 30
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: category
            label: Category and format
            type: string
          - name: title
            label: Title
            type: string
            required: true
          - name: credit
            label: Composer or project credit
            type: string
          - name: description
            label: Description
            type: text
          - name: url
            label: Watch or listen URL
            type: string
            required: true
          - name: thumbnail
            label: Optional thumbnail image
            description: Leave blank to use the YouTube video thumbnail.
            type: image
            options:
              media: images
              categories: [image]

content:
  - name: artist_site
    label: Homepage content
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: en
        label: English
        component: site_content
        required: true
      - name: zh_hant
        label: Traditional Chinese
        component: site_content
        required: true
  - name: media_library
    label: Media library
    type: file
    path: content/media.json
    format: json
    operations:
      delete: false
    fields:
      - name: en
        label: English
        component: media_content
        required: true
      - name: zh_hant
        label: Traditional Chinese
        component: media_content
        required: true
