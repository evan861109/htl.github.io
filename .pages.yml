media:
  - name: images
    label: Site images
    input: assets
    output: assets
    extensions: [png, jpg, jpeg, webp]
    rename: safe

components:
  site_content:
    type: object
    fields:
      - name: seo
        label: Search appearance
        type: object
        fields:
          - name: title
            label: Browser title
            type: string
          - name: description
            label: Search description
            type: text
      - name: artist
        label: Artist
        type: object
        fields:
          - name: name
            label: Full name
            type: string
          - name: mark
            label: Header mark
            type: string
          - name: role
            label: Intro role
            type: string
      - name: hero
        label: First screen
        type: object
        fields:
          - name: image
            label: Hero image
            type: image
          - name: image_alt
            label: Image description
            type: text
          - name: eyebrow
            label: Short introduction
            type: string
          - name: tagline
            label: Main statement
            type: text
          - name: primary_cta
            label: First button label
            type: string
          - name: secondary_cta
            label: Second button label
            type: string
      - name: ui
        label: Navigation and interface labels
        type: object
        fields:
          - name: nav-about
            label: About navigation label
            type: string
          - name: nav-listen
            label: Listen navigation label
            type: string
          - name: nav-media
            label: Media navigation label
            type: string
          - name: nav-projects
            label: Projects navigation label
            type: string
          - name: nav-materials
            label: Materials navigation label
            type: string
          - name: nav-contact
            label: Contact navigation label
            type: string
          - name: about-kicker
            label: About section label
            type: string
          - name: listen-kicker
            label: Listen section label
            type: string
          - name: listen-heading
            label: Listen heading
            type: string
          - name: media-library-link
            label: Media library link
            type: string
          - name: artist-biography-link
            label: Biography link
            type: string
          - name: performance-videos-link
            label: Performance videos link
            type: string
          - name: booking-materials-link
            label: Booking materials link
            type: string
          - name: contact-kicker
            label: Contact section label
            type: string
          - name: back-to-top
            label: Back to top label
            type: string
          - name: back-to-home
            label: Back to home label
            type: string
          - name: watch
            label: Watch button label
            type: string
      - name: highlights
        label: Highlights
        type: string
        list:
          min: 3
          max: 3
      - name: about
        label: Biography
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
          - name: paragraphs
            label: Biography paragraphs
            type: text
            list:
              min: 1
              max: 6
      - name: tracks
        label: Featured videos
        type: object
        list:
          min: 1
          max: 8
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: meta
            label: Category and format
            type: string
          - name: title
            label: Title
            type: string
          - name: note
            label: Description
            type: text
          - name: url
            label: Video URL
            type: string
      - name: projects
        label: Projects and recognition
        type: object
        fields:
          - name: kicker
            label: Section label
            type: string
          - name: heading
            label: Heading
            type: string
          - name: items
            label: Entries
            type: object
            list:
              min: 1
              max: 8
              collapsible:
                collapsed: true
                summary: "{year} - {title}"
            fields:
              - name: year
                label: Year
                type: string
              - name: title
                label: Title
                type: string
              - name: description
                label: Description
                type: text
      - name: statement
        label: Artist statement
        type: object
        fields:
          - name: text
            label: Statement
            type: text
          - name: credit
            label: Credit line
            type: string
      - name: contact
        label: Contact
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
          - name: availability
            label: Availability and location
            type: text
          - name: email
            label: Booking email
            type: string
          - name: notice
            label: Message shown when no email is available
            type: text
          - name: links
            label: Social links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: label
                label: Label
                type: string
              - name: url
                label: URL
                type: string
  media_content:
    type: object
    fields:
      - name: seo
        label: Search appearance
        type: object
        fields:
          - name: title
            label: Browser title
            type: string
          - name: description
            label: Search description
            type: text
      - name: hero
        label: Media page header
        type: object
        fields:
          - name: image
            label: Header image
            type: image
          - name: image_alt
            label: Image description
            type: text
          - name: eyebrow
            label: Short introduction
            type: string
          - name: title
            label: Heading
            type: string
          - name: description
            label: Introduction
            type: text
      - name: ui
        label: Interface labels
        type: object
        fields:
          - name: archive-kicker
            label: Archive section label
            type: string
          - name: archive-heading
            label: Archive heading
            type: string
          - name: booking-inquiry
            label: Booking inquiry label
            type: string
          - name: watch
            label: Watch button label
            type: string
      - name: entries
        label: Media entries
        type: object
        list:
          min: 1
          max: 30
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: category
            label: Category and format
            type: string
          - name: title
            label: Title
            type: string
          - name: credit
            label: Composer or project credit
            type: string
          - name: description
            label: Description
            type: text
          - name: url
            label: Watch or listen URL
            type: string
          - name: thumbnail
            label: Optional thumbnail path
            description: Leave blank to use the YouTube video thumbnail.
            type: string

content:
  - name: artist_site
    label: Homepage content
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: en
        label: English
        component: site_content
      - name: zh_hant
        label: Traditional Chinese
        component: site_content
  - name: media_library
    label: Media library
    type: file
    path: content/media.json
    format: json
    operations:
      delete: false
    fields:
      - name: en
        label: English
        component: media_content
      - name: zh_hant
        label: Traditional Chinese
        component: media_content
