name: Validate and deploy site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate Pages CMS configuration
        run: ruby scripts/validate-pages-cms.rb
      - name: Run regression checks
        run: npm test
      - name: Build fingerprinted site artifact
        if: github.event_name == 'push'
        run: npm run build
        env:
          SITE_VERSION: ${{ github.sha }}
      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v6
      - name: Upload validated site
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated site
        id: deployment
        uses: actions/deploy-pages@v5
